spring.application.name=travelbird-backend

# Database (MySQL) - 로컬 실행은 docker-compose.yml + .env 참고
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travelbird?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:travelbird}
spring.datasource.password=${DB_PASSWORD:travelbird_local_pw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:dev-only-local-secret-key-please-override-in-real-envs-32bytes+}
jwt.access-token-expiration-seconds=1800
jwt.refresh-token-expiration-seconds=2592000

# Kakao
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# Open-Meteo
open-meteo.forecast-uri=https://api.open-meteo.com/v1/forecast

# TourAPI (한국관광공사 국문 관광정보 서비스 4.0)
tour-api.base-uri=https://apis.data.go.kr/B551011/KorService2
tour-api.service-key=${TOUR_API_SERVICE_KEY:}
tour-api.sync-cron=0 0 1 * * *

# S3 이미지 업로드 (3.5.1) — 자격증명은 AWS 기본 Credential Chain(환경변수 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)을 사용
aws.s3.region=${AWS_S3_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:}
file.presigned-upload.validity-minutes=15
file.pending-file.expiry-hours=24
file.pending-file.cleanup-cron=0 0 * * * *

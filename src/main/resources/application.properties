spring.application.name=travelbird-backend

# JWT
jwt.secret=${JWT_SECRET:dev-only-local-secret-key-please-override-in-real-envs-32bytes+}
jwt.access-token-expiration-seconds=1800
jwt.refresh-token-expiration-seconds=2592000

# Kakao
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# Open-Meteo
open-meteo.forecast-uri=https://api.open-meteo.com/v1/forecast

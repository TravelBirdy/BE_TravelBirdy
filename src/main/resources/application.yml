spring:
  application:
    name: travelbird

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    time-zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-seconds: 1800
    refresh-token-seconds: 2592000

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

  ai:
    server-base-url: ${AI_SERVER_BASE_URL}
    internal-key: ${TRAVELBIRD_AI_CALLBACK_KEY}
    callback-timeout-seconds: 180

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET}
